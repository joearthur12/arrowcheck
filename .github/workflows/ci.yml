name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHRIMP_SHA: 56dd595af0ce2ab8d594d2201c9906cc48489089

    steps:
      - name: Check out ArrowCheck
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ArrowCheck currently expects a local pinned ChRIMP checkout.
      # This workflow intentionally relies on the lint-only visualizer bypass,
      # so it does not install native Cairo packages here.
      - name: Clone pinned ChRIMP checkout
        run: |
          mkdir -p upstream
          git clone https://github.com/schwallergroup/ChRIMP.git upstream/ChRIMP
          git -C upstream/ChRIMP checkout "$CHRIMP_SHA"
          git -C upstream/ChRIMP rev-parse HEAD

      - name: Install ArrowCheck and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Probe ArrowCheck upstream adapter
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          print("cwd:", os.getcwd())
          print("python:", sys.version)
          print("upstream exists:", Path("upstream/ChRIMP/src").exists())

          try:
              from arrowcheck.engine import lint_mechanism
          except Exception as exc:
              print("\n=== import_failure ===")
              print(
                  json.dumps(
                      {
                          "error": "import_failure",
                          "exception_type": type(exc).__name__,
                          "exception_message": str(exc),
                      },
                      indent=2,
                  )
              )
          else:
              cases = {
                  "valid_file": Path("examples/valid.txt").read_text(encoding="utf-8"),
                  "radical_noop": "[CH3:1]|",
              }

              for name, mechsmiles in cases.items():
                  print(f"\n=== {name} ===")
                  try:
                      result = lint_mechanism(mechsmiles)
                      print(result.model_dump_json(indent=2))
                  except Exception as exc:
                      print(
                          json.dumps(
                              {
                                  "error": "lint_mechanism_raised",
                                  "case": name,
                                  "exception_type": type(exc).__name__,
                                  "exception_message": str(exc),
                              },
                              indent=2,
                          )
                      )
          PY

      - name: Run pytest
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src

      # Current uncertainty: this path assumes PyPI wheels for rdkit remain
      # available on ubuntu-latest for Python 3.12. If that changes, the
      # fallback is to move this workflow to windows-latest.
