[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrowcheck"
version = "0.1.0"
description = "Secure structural linting and batch debugging for MechSMILES reaction mechanisms."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Joe Ganly" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Jinja2>=3.1.6,<4",
    "pydantic>=2.13.4,<3",
    "rdkit>=2026.3.2",
    "rich>=15.0.0,<16",
    "typer>=0.26.4,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.1.0,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.15,<1",
]

[project.scripts]
arrowcheck = "arrowcheck.cli:app"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arrowcheck" = ["templates/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 120
extend-exclude = ["upstream", ".mplconfig"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
no_site_packages = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
